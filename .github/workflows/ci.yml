name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # build number = commit count
          persist-credentials: false

      - name: Tools
        run: brew list pkgconf >/dev/null 2>&1 || brew install pkgconf

      - name: Helper script tests
        run: sh scripts/test-helpers.sh

      - name: Swift tests
        run: swift test

      # Not for release tags: a release builds sstpc from the pinned,
      # checksummed sources instead of trusting a cached binary that runs as root.
      - name: Cache sstpc
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/sstpc
          key: sstpc-${{ hashFiles('scripts/build-sstpc.sh', 'scripts/patches/*') }}

      - name: Build sstpc
        run: test -f build/sstpc/LICENSE.OpenSSL || sh scripts/build-sstpc.sh

      - name: Build app and DMG
        run: |
          sh scripts/build-app.sh
          sh scripts/make-dmg.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keid-dmg
          path: build/Keid-*.dmg*

  # The only job with write access, and it runs no repository code.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Keid-dmg
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/Keid-*.dmg dist/Keid-*.dmg.sha256 --generate-notes
